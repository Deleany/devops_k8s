apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: elk-vs
  namespace: logging
spec:
  exportTo:
    - "*"
  hosts:
  - "elk.rezz.io"
  gateways:
  - mesh
  - elk-gw
  tls:
  - match:
    - gateways:
        - mesh
      port: 9200
      sniHosts:
        - "elk.rezz.io"
    route:
    - destination:
        host: external-elk-svc.logging.svc.cluster.local #istio-egressgateway.istio-system.svc.cluster.local
        port:
          number: 2021
      weight: 100

  - match:
    - gateways:
        - elk-gw
      port: 2021
      sniHosts:
        - "elk.rezz.io"
    route:
    - destination:
        host: "elk.rezz.io"
        port:
          number: 9200
      weight: 100
